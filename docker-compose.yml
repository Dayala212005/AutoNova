x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - uploads:/var/www/uploads:ro
    depends_on:
      - app
    networks:
      - frontnet
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 256m

  app:
    build: ./app
    user: node
    env_file: .env
    expose:
      - "3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontnet
      - backnet
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *logging
    pids_limit: 200
    mem_limit: 512m

  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - backnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 512m

networks:
  frontnet:
  backnet:
    internal: true

volumes:
  uploads:
  pgdata:
