<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administrador - AutoNova</title>
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/catalogo.css">
</head>

<body>

  <header id="main-navbar"></header>

  <main>
    <section class="vendor-hero">
      <div class="vendor-hero-overlay"></div>
      <div class="vendor-hero-content">
        <p class="vendor-hero-tag">Panel de Administrador</p>
        <h1 class="vendor-hero-title">Gestiona usuarios y productos</h1>
        <p class="vendor-hero-desc">Crea cuentas de vendedores, administra roles y supervisa el inventario de la agencia.</p>
      </div>
    </section>

    <div class="dashboard-container">
      <div class="dashboard-grid">

        <div class="dashboard-card">
          <h2 class="dashboard-card-title">Crear usuario</h2>

          <form id="user-form">
            <div class="form-group">
              <label for="user-name">Nombre completo</label>
              <input type="text" id="user-name" placeholder="Ej. Juan Pérez" required>
            </div>

            <div class="form-group">
              <label for="user-email">Correo electrónico</label>
              <input type="email" id="user-email" placeholder="correo@autonova.test" required>
            </div>

            <div class="form-group">
              <label for="user-password">Contraseña</label>
              <input type="password" id="user-password" placeholder="Contraseña temporal" required>
            </div>

            <div class="form-group">
              <label for="user-role">Rol</label>
              <select id="user-role" required>
                <option value="comprador">Comprador</option>
                <option value="vendedor" selected>Vendedor</option>
                <option value="admin">Administrador</option>
              </select>
            </div>

            <button type="submit" class="btn-submit">Crear usuario</button>
          </form>
        </div>

        <div class="dashboard-card">
          <h2 class="dashboard-card-title">Usuarios del sistema</h2>
          <div class="products-list" id="users-list"></div>
        </div>

      </div>

      <div class="dashboard-grid" style="margin-top: 1.5rem;">
        <div class="dashboard-card" style="grid-column: 1 / -1;">
          <h2 class="dashboard-card-title">Productos del sistema</h2>
          <div class="products-list" id="admin-products-list"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="main-footer"></div>

  <script src="./js/api.js"></script>
  <script src="./components/navbar.js"></script>
  <script src="./components/footer.js"></script>
  <script src="./js/admin.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      renderNavbar('main-navbar');
      renderFooter('main-footer');
      initAdmin();
    });
  </script>
</body>

</html>
