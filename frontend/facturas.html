<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis facturas - AutoNova</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/catalogo.css">
</head>

<body>
    <header id="main-navbar"></header>

    <main>
        <div class="fx-wrap">
            <div class="fx-top">
                <h1 class="fx-title">Mis facturas</h1>
                <a href="comprador.html" class="btn btn-outline">&#8592; Volver al catálogo</a>
            </div>
            <div class="fx-card" id="facturas-lista"></div>
        </div>
    </main>

    <div id="main-footer"></div>

    <script src="./js/api.js"></script>
    <script src="./components/navbar.js"></script>
    <script src="./components/footer.js"></script>
    <script src="./js/facturas.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            renderNavbar('main-navbar');
            renderFooter('main-footer');
            initFacturas();
        });
    </script>
</body>

</html>
